overlay: 1.0.0
info:
  title: API Evangelist enhancements for Mist API
  version: 1.0.0
extends: openapi/mist-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-20'
      x-apievangelist-provider: mist
      x-apievangelist-notes: >-
        Juniper Mist Cloud API. Token auth (Basic Auth deprecated Sept 2026);
        hourly rate quota with 429; org/site webhooks + WebSocket streaming;
        12 regional hosts. See conventions/, lifecycle/, errors/, asyncapi/.
  - target: $.info
    update:
      x-apievangelist-artifacts:
        authentication: authentication/mist-authentication.yml
        conventions: conventions/mist-conventions.yml
        errors: errors/mist-problem-types.yml
        lifecycle: lifecycle/mist-lifecycle.yml
        rate_limits: rate-limits/mist-rate-limits.yml
        webhooks: asyncapi/mist-webhooks.yml
        data_model: data-model/mist-data-model.yml
