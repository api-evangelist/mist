- aid: mist:mist-orgs-antivirus-profiles-api
  name: Mist Orgs Antivirus Profiles API
  description: "Antivirus profiles are used to define the content to scan for any malware and the action\
    \ to be taken when malware is detected. \nThese profiles can be assigned to Content Security policies\
    \ to scan Web, file transfer, and e-mail traffic. \nThe profiles help in ensuring that the network\
    \ is protected from malicious content by specifying fallback options and notification methods when\
    \ malware is detected or when the antivirus system experiences errors.\n\n\nKey Features of Antivirus\
    \ Profiles:\n\n* Content Scanning: Defines the content to scan for malware.\n* Action on Detection:\
    \ Specifies the action to be taken when malware is detected.\n* Fallback Options: Configures actions\
    \ to be taken when the antivirus system encounters errors.\n* Notification Options: Sets up methods\
    \ to notify users when a fallback occurs or a virus is detected."
