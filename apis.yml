- aid: mist:mist-orgs-admins-api
  name: Mist Orgs Admins API
  description: >-
    An org admin, or organization administrator, is a user with administrative privileges within a specific
    organization. They have the authority to manage and oversee the operations and settings of that organization's
    portal.

     The different types of access levels for an org admin include:
     * Super User: This role has full access to the MSP portal and all tenant organizations. A super user
    can manage other administrators and has the highest level of privileges.
     * Network Admin: A network admin has limited access to the MSP portal. They can be granted access
    to all organizations or specific organizations, with access to limited features in the organizations'
    portals. They are responsible for monitoring, verifying, and troubleshooting the network within their
    assigned organizations.
     * Observer: An observer has view-only access to limited features in the MSP portal. They can be granted
    access to all organizations or specific organizations, with view-only access to limited features in
    the organizations' portals. Observers monitor events in the network and bring any issues to the attention
    of the network administrator for resolution.
     * Installer: An installer can be granted access to all organizations or specific organizations, with
    only the ability to install access points for these organizations. They are responsible for setting
    up and installing access points in the network.
     * Helpdesk: A helpdesk user can be granted access to all organizations or specific organizations,
    with only helpdesk monitoring and workflow capabilities for these organizations. They assist with
    monitoring and resolving issues reported by users within the organization.

     These different access levels allow org admins to perform their specific roles and responsibilities
    within the MSP portal while ensuring appropriate access and security measures are in place.
  humanURL: https://www.juniper.net/documentation/us/en/software/mist/automation-integration/
  baseURL: https://api.mist.com/api/v1
  tags:
  - Orgs Admins
  properties:
  - type: OpenAPI
    url: openapi/mist-orgs-admins-api-openapi.yml
- aid: mist:mist-orgs-advanced-anti-malware-profiles-api
  name: Mist Orgs Advanced Anti Malware Profiles API
  description: >-
    The "Advanced Anti-Malware" feature in Sky ATP is a comprehensive security solution that leverages
    multiple techniques to detect and prevent malware attacks. Here are the key components of this feature:

    * **Flow-Based Antivirus Policy**: The policy checks inbound and outbound traffic to stop malware,
    quarantine infected systems, prevent data exfiltration, and disrupt lateral movement.

    * **Machine Learning-Based Threat Detection**: Sky ATP uses machine learning to identify zero-day
    threats and detect malware that traditional antivirus software might miss.

    * **Integration with SRX Series Firewalls**: The SRX Series firewalls integrate with Sky ATP to block
    known malicious file downloads and outbound Command and Control (C&C) traffic. This integration ensures
    that malware is quickly identified and dropped before it can infect a host.

    * **Real-Time Threat Intelligence**: Sky ATP distributes third-party threat intelligence feeds to
    all ATP-subscribed SRX firewalls for immediate action, reducing the attack surface.


    These components collectively provide a robust and automated threat detection and remediation solution,
    simplifying cybersecurity infrastructure and processes for organizations.


    For more details, you can refer to the Juniper documentation on advanced anti-malware policy configuration.
  humanURL: https://www.juniper.net/documentation/us/en/software/mist/automation-integration/
  baseURL: https://api.mist.com/api/v1
  tags:
  - Orgs Advanced Anti Malware Profiles
  properties:
  - type: OpenAPI
    url: openapi/mist-orgs-advanced-anti-malware-profiles-api-openapi.yml
