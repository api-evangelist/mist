description: >-
  Mist (Mist Systems), acquired by Juniper Networks and now Juniper Mist, is an
  AI-driven cloud platform for wireless, wired, and WAN networking. The Juniper
  Mist Cloud API is a RESTful HTTPS/JSON API organized around an Org -> Site ->
  Device hierarchy, giving programmatic access to configuration, inventory,
  client analytics (SLE), the Marvis virtual network assistant, location
  services, and real-time event webhooks. Mist was an early Lightspeed Venture
  Partners portfolio company (seed, 2014) before its Juniper acquisition.
