- aid: mist:mist-sites-synthetic-tests-api
  name: Mist Sites Synthetic Tests API
  description: >-
    Synthetic Tests (Marvis Minis) are a feature of Juniper Networks' Mist platform, designed to proactively
    identify and resolve network issues before they impact users by simulating user connections and validating
    network configurations.



    Here are the key points about Marvis Minis:


    * Proactive Testing: Marvis Minis perform user connection tests to validate connectivity and application
    reachability issues on your network. These tests run automatically every hour and can also be initiated
    manually by an admin user.

    * Scope and Stress Management: By default, Marvis Minis run on a few APs based on the scope it automatically
    learns, and it can expand the scope to other APs and switches if necessary, without causing additional
    stress on network services.

    * Integration with Mist AI: Data from Marvis Minis is continuously fed back into the Mist AI engine,
    providing additional insights for AIOps responses. This data is also integrated into Marvis Actions
    for proactive resolution and validation.

    * Subscription and Accessibility: Marvis Minis are available at no extra charge with a Marvis VNA
    subscription and do not require additional hardware or software.
  humanURL: https://www.juniper.net/documentation/us/en/software/mist/automation-integration/
  baseURL: https://api.mist.com/api/v1
