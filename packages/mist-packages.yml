generated: '2026-07-20'
method: searched
source: https://github.com/mistsys
summary: >-
  First-party Juniper/Mist automation tooling plus the widely-used community
  Python SDK generated from the official OpenAPI spec. Mist does not publish a
  first-party multi-language SDK family; automation is delivered via the
  official Terraform and Ansible providers and the OpenAPI/Postman specs.
packages:
  - language: hcl
    registry: terraform
    name: Juniper/mist
    url: https://registry.terraform.io/providers/Juniper/mist/latest
    install: 'terraform { required_providers { mist = { source = "Juniper/mist" } } }'
    official: true
    note: Official Juniper Terraform provider for managing Mist organizations (day 0/1).
  - language: python
    registry: pypi
    name: mistapi
    url: https://pypi.org/project/mistapi/
    install: pip install --upgrade mistapi
    official: false
    note: >-
      Community Python SDK (tmunzer/mistapi_python) auto-generated from the
      official Mist OpenAPI spec; the de-facto Python client. Includes a
      WebSocket client for real-time event streaming.
  - language: python
    registry: pypi
    name: sdksio-juniper-mist-sdk
    url: https://pypi.org/project/sdksio-juniper-mist-sdk/
    install: pip install sdksio-juniper-mist-sdk
    official: false
    note: Third-party (APIMatic/sdks.io) generated Python SDK.
specs_and_collections:
  - kind: openapi
    name: mist_openapi
    url: https://github.com/mistsys/mist_openapi
    official: true
    note: Manually maintained OpenAPI 3.1 documentation spec (mist.openapi.yaml/json).
  - kind: postman
    name: Juniper Mist Cloud APIs (public workspace)
    url: https://www.postman.com/juniper-mist/
    official: true
