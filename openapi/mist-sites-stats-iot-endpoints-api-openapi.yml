security:
- apiToken: []
- csrfToken: []
tags:
- description: API Calls to retrieve IoT Endpoint statistics for the current Site
  name: Sites Stats - IoT Endpoints
paths:
  /api/v1/sites/{site_id}/iotendpoints/search:
    parameters:
    - $ref: '#/components/parameters/site_id'
    get:
      description: Search IoT Endpoints
      operationId: searchSiteIotEndpoints
      parameters:
      - description: Filter results by AP MAC address
        in: query
        name: ap_mac
        schema:
          examples:
          - 5c5b350e0001
          type: string
      - description: Filter results by MAC address
        in: query
        name: mac
        schema:
          examples:
          - 63f9e299182b63f9
          type: string
      - description: 'IoT endpoint type. enum: `zigbee`'
        in: query
        name: type
        schema:
          examples:
          - zigbee
          type: string
      - description: Filter results by manufacturer
        in: query
        name: mfg
        schema:
          examples:
          - Assa Abloy
          type: string
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/end'
      - $ref: '#/components/parameters/duration'
      responses:
        '200':
          $ref: '#/components/responses/IotEndpointsSearch'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '429':
          $ref: '#/components/responses/HTTP429'
      summary: searchSiteIotEndpoints
      tags:
      - Sites Stats - IoT Endpoints
components:
  examples:
    IotEndpointsSearchExample:
      value:
        end: 1531862583.0
        results:
        - ap_mac: 5c5b350e0001
          id: 63f9e299182b63f9
          lqi: 178
          mac: 63f9e299182b63f9
          mfg: Assa Abloy
          model: Assa Abloy
          timestamp: 1531782218
          type: zigbee
        start: 1531776183.0
        total: 2
    HTTP400Example:
      value:
        detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
    HTTP429Example:
      value:
        detail: Too Many Request. The API Token used for the request reached the 5000 API Calls per hour threshold
    HTTP403Example:
      value:
        detail: You do not have permission to perform this action.
    HTTP401Example:
      value:
        detail: Authentication credentials were not provided.
  schemas:
    response_http403:
      additionalProperties: false
      description: Standard HTTP 403 permission error response
      properties:
        detail:
          description: Human-readable explanation of the permission error
          examples:
          - You do not have permission to perform this action.
          type: string
      type: object
    response_iot_endpoints_search_results:
      description: IoT endpoint statistics returned by a search response
      items:
        $ref: '#/components/schemas/iotendpoint_stats'
      type: array
      uniqueItems: true
    response_http400:
      additionalProperties: false
      description: Standard HTTP 400 bad request error response
      properties:
        detail:
          description: Human-readable explanation of the bad request error
          examples:
          - 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
          type: string
      type: object
    response_iot_endpoints_search:
      additionalProperties: false
      description: Time-bounded response for IoT endpoint search results
      properties:
        end:
          description: Epoch timestamp, in seconds, for the end of the IoT endpoint search window
          type: number
        results:
          $ref: '#/components/schemas/response_iot_endpoints_search_results'
          description: IoT endpoint statistics matching the search filters
        start:
          description: Epoch timestamp, in seconds, for the start of the IoT endpoint search window
          type: number
        total:
          description: Number of IoT endpoint records matching the search filters
          type: integer
      required:
      - start
      - end
      - total
      - results
      type: object
    response_http404:
      additionalProperties: false
      description: Standard HTTP 404 not found error response
      properties:
        id:
          description: Missing resource identifier, when the API includes one
          type: string
      type: object
    response_http401:
      additionalProperties: false
      description: Standard HTTP 401 authentication error response
      properties:
        detail:
          description: Human-readable explanation of the authentication error
          examples:
          - Authentication credentials were not provided.
          type: string
      type: object
    response_http429:
      additionalProperties: false
      description: Standard HTTP 429 rate limit error response
      properties:
        detail:
          description: Human-readable explanation of the rate limit error
          examples:
          - Too Many Request. The API Token used for the request reached the 5000 API Calls per hour threshold
          type: string
      type: object
    iotendpoint_stats:
      additionalProperties: false
      description: IoT endpoint statistics returned by a search response
      properties:
        ap_mac:
          description: MAC address of the AP the endpoint was seen on
          examples:
          - 5c5b350e0001
          type: string
        id:
          description: Unique identifier for the IoT endpoint
          examples:
          - 63f9e299182b63f9
          type: string
        lqi:
          description: Link Quality Indicator (0–255)
          maximum: 255
          minimum: 0
          type: integer
        mac:
          description: Endpoint MAC address reported in IoT statistics
          examples:
          - 63f9e299182b63f9
          type: string
        mfg:
          description: Manufacturer name reported for the IoT endpoint
          examples:
          - Assa Abloy
          type: string
        model:
          description: Device model reported for the IoT endpoint
          examples:
          - Assa Abloy
          type: string
        timestamp:
          description: Epoch timestamp of the last observation, in seconds
          type: number
        type:
          description: 'IoT endpoint type. enum: `zigbee`'
          examples:
          - zigbee
          type: string
      type: object
  parameters:
    site_id:
      in: path
      name: site_id
      required: true
      schema:
        examples:
        - 000000ab-00ab-00ab-00ab-0000000000ab
        format: uuid
        type: string
    start:
      description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
      in: query
      name: start
      schema:
        type: string
    end:
      description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
      in: query
      name: end
      schema:
        type: string
    limit:
      description: Maximum number of results to return per page
      in: query
      name: limit
      schema:
        default: 100
        minimum: 0
        type: integer
    duration:
      description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
      in: query
      name: duration
      schema:
        default: 1d
        examples:
        - 10m
        type: string
  responses:
    HTTP401:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP401Example'
          schema:
            $ref: '#/components/schemas/response_http401'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP401Example'
          schema:
            $ref: '#/components/schemas/response_http401'
      description: Unauthorized
    HTTP400:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP400Example'
          schema:
            $ref: '#/components/schemas/response_http400'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP400Example'
          schema:
            $ref: '#/components/schemas/response_http400'
      description: Bad Syntax
    HTTP404:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/response_http404'
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/response_http404'
      description: Not found. The API endpoint doesn’t exist or resource doesn’ t exist
    HTTP403:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP403Example'
          schema:
            $ref: '#/components/schemas/response_http403'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP403Example'
          schema:
            $ref: '#/components/schemas/response_http403'
      description: Permission Denied
    IotEndpointsSearch:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/IotEndpointsSearchExample'
          schema:
            $ref: '#/components/schemas/response_iot_endpoints_search'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/IotEndpointsSearchExample'
          schema:
            $ref: '#/components/schemas/response_iot_endpoints_search'
      description: OK
    HTTP429:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP429Example'
          schema:
            $ref: '#/components/schemas/response_http429'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP429Example'
          schema:
            $ref: '#/components/schemas/response_http429'
      description: Too Many Request. The API Token used for the request reached the 5000 API Calls per hour threshold
  securitySchemes:
    apiToken:
      description: "Preferred authentication method for automation and integrations. Send the API token in the HTTP `Authorization` header.\n\n**Format**:\n  `Authorization: Token {apitoken}`\n\n**Notes**:\n* An API token generated for a specific admin has the same privileges as that admin\n* An API token is automatically removed if it is not used for more than 90 days\n* SSO admins cannot generate admin API tokens. Use organization API tokens when scoped Org/Site privileges are needed."
      in: header
      name: Authorization
      type: apiKey
    csrfToken:
      description: 'Session-based authentication for browser or login/password flows. After a successful [Login](/#operations/login) request, Mist returns a `csrftoken` cookie. Send that value in the `X-CSRFToken` header on later API requests that use the login session.


        **Format**:

        ```

        X-CSRFToken: vwvBuq9qkqaKh7lu8tNc0gkvBfEaLAmx

        ```


        For automation, API Token authentication is preferred.'
      in: header
      name: X-CSRFToken
      type: apiKey
