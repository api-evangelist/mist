        pattern: ^[0-9a-fA-F]{12}$
        type: string
    device_id:
      in: path
      name: device_id
      required: true
      schema:
        examples:
        - 000000ab-00ab-00ab-00ab-0000000000ab
        format: uuid
        type: string
    site_id:
      in: path
      name: site_id
      required: true
      schema:
        examples:
        - 000000ab-00ab-00ab-00ab-0000000000ab
        format: uuid
        type: string
  examples:
    ReauthWiredClientExample:
      value:
        device_mac: 5c5b35000002
        port_id: ge-0/0/0
        session: 0a2a11b8-4b30-40d8-a6d1-e91ea540d86f
    DeviceBiosUpgradeExample:
