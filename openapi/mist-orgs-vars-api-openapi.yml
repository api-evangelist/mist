tags:
- description: Vars endpoints are used to retrieve the list of Site Variables across all the Sites.
  name: Orgs Vars
paths:
  /api/v1/orgs/{org_id}/vars/search:
    parameters:
    - $ref: '#/components/parameters/org_id'
    get:
      description: 'Search vars


        Example: /api/v1/orgs/{org_id}/vars/search?vars=*'
      operationId: searchOrgVars
      parameters:
      - description: Filter results by site identifier. Accepts multiple comma-separated values.
        in: query
        name: site_id
        schema:
          examples:
          - 00000000-0000-0000-0000-000000000001,00000000-0000-0000-0000-000000000002
          type: string
      - description: Filter variable results by variable name. Accepts multiple comma-separated values.
        in: query
        name: var
        schema:
          examples:
          - guest_end,guest_net
          type: string
      - description: 'Filter results by source. enum: `deviceprofile`, `site`'
        in: query
        name: src
        schema:
          $ref: '#/components/schemas/var_source'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/search_after'
      responses:
        '200':
          $ref: '#/components/responses/SearchVar'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '429':
          $ref: '#/components/responses/HTTP429'
      summary: searchOrgVars
      tags:
      - Orgs Vars
components:
  schemas:
    response_search_var_item:
      additionalProperties: false
      description: Organization variable record returned by search
      properties:
        created_time:
          $ref: '#/components/schemas/created_time'
          description: Timestamp when the organization variable was created
        modified_time:
          $ref: '#/components/schemas/modified_time'
          description: Timestamp when the organization variable was last modified
        org_id:
          $ref: '#/components/schemas/org_id'
          description: Organization associated with the variable
        site_id:
          $ref: '#/components/schemas/site_id'
          description: Site associated with the variable, when the source is site-scoped
        src:
          description: Source scope for the variable, such as `site` or `deviceprofile`
          type: string
        var:
          description: Name of the variable matched by the search
          type: string
      type: object
    response_http403:
      additionalProperties: false
      description: Standard HTTP 403 permission error response
      properties:
        detail:
          description: Human-readable explanation of the permission error
          examples:
          - You do not have permission to perform this action.
          type: string
      type: object
    response_search_var_results:
      description: Organization variable records returned by search
      items:
        $ref: '#/components/schemas/response_search_var_item'
      type: array
    org_id:
      description: Unique identifier of a Mist organization
      examples:
      - a97c1b22-a4e9-411e-9bfd-d8695a0f9e61
      format: uuid
      readOnly: true
      type: string
    response_http400:
      additionalProperties: false
      description: Standard HTTP 400 bad request error response
      properties:
        detail:
          description: Human-readable explanation of the bad request error
          examples:
          - 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
          type: string
      type: object
    response_search_var:
      additionalProperties: false
      description: Paginated response for organization variable search results
      properties:
        end:
          description: Epoch timestamp, in seconds, for the end of the variable search window
          type: integer
        limit:
          description: Maximum number of variable records returned in this page
          type: integer
        next:
          description: URL for retrieving the next page of variable search results
          type: string
        results:
          $ref: '#/components/schemas/response_search_var_results'
          description: Organization variable records matching the search filters
        start:
          description: Epoch timestamp, in seconds, for the start of the variable search window
          type: integer
        total:
          description: Number of variable records matching the search filters across all pages
          type: integer
      type: object
    modified_time:
      description: When the object has been modified for the last time, in epoch
      format: double
      readOnly: true
      type: number
    response_http404:
      additionalProperties: false
      description: Standard HTTP 404 not found error response
      properties:
        id:
          description: Missing resource identifier, when the API includes one
          type: string
      type: object
    response_http401:
      additionalProperties: false
      description: Standard HTTP 401 authentication error response
      properties:
        detail:
          description: Human-readable explanation of the authentication error
          examples:
          - Authentication credentials were not provided.
          type: string
      type: object
    response_http429:
      additionalProperties: false
      description: Standard HTTP 429 rate limit error response
      properties:
        detail:
          description: Human-readable explanation of the rate limit error
          examples:
          - Too Many Request. The API Token used for the request reached the 5000 API Calls per hour threshold
          type: string
      type: object
    site_id:
      description: Unique identifier of a Mist site
      examples:
      - 441a1214-6928-442a-8e92-e1d34b8ec6a6
      format: uuid
      readOnly: true
      type: string
    created_time:
      description: When the object has been created, in epoch
      format: double
      readOnly: true
      type: number
    var_source:
      description: 'Source level where a variable is defined. enum: `deviceprofile`, `site`'
      enum:
      - deviceprofile
      - site
      type: string
  responses:
    HTTP401:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP401Example'
          schema:
            $ref: '#/components/schemas/response_http401'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP401Example'
          schema:
            $ref: '#/components/schemas/response_http401'
      description: Unauthorized
    HTTP400:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP400Example'
          schema:
            $ref: '#/components/schemas/response_http400'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP400Example'
          schema:
            $ref: '#/components/schemas/response_http400'
      description: Bad Syntax
    HTTP404:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/response_http404'
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/response_http404'
      description: Not found. The API endpoint doesn’t exist or resource doesn’ t exist
    HTTP403:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP403Example'
          schema:
            $ref: '#/components/schemas/response_http403'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP403Example'
          schema:
            $ref: '#/components/schemas/response_http403'
      description: Permission Denied
    HTTP429:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP429Example'
          schema:
            $ref: '#/components/schemas/response_http429'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP429Example'
          schema:
            $ref: '#/components/schemas/response_http429'
      description: Too Many Request. The API Token used for the request reached the 5000 API Calls per hour threshold
    SearchVar:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/SearchVarExample'
          schema:
            $ref: '#/components/schemas/response_search_var'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/SearchVarExample'
          schema:
            $ref: '#/components/schemas/response_search_var'
      description: OK
  examples:
    HTTP400Example:
      value:
        detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
    HTTP429Example:
      value:
        detail: Too Many Request. The API Token used for the request reached the 5000 API Calls per hour threshold
    SearchVarExample:
      value:
        end: 1693952979
        limit: 10
        results:
        - created_time: 1618457655.384858
          modified_time: 1693610886.477805
          org_id: 0c160b7f-1027-4cd1-923b-744534c4b070
          site_id: 1519f016-4e41-47c0-a396-cce4d04bac0b
          src: site
          var: mvp
        start: 1693949379
        total: 1
    HTTP403Example:
      value:
        detail: You do not have permission to perform this action.
    HTTP401Example:
      value:
        detail: Authentication credentials were not provided.
  parameters:
    sort:
      description: On which field the list should be sorted, -prefix represents DESC order
      in: query
      name: sort
      schema:
        default: timestamp
        examples:
        - -site_id
        type: string
    org_id:
      in: path
      name: org_id
      required: true
      schema:
        examples:
        - 000000ab-00ab-00ab-00ab-0000000000ab
        format: uuid
        type: string
    search_after:
      description: Pagination cursor for retrieving subsequent pages of results. This value is automatically populated by Mist in the `next` URL from the previous response and should not be manually constructed.
      in: query
      name: search_after
      schema:
        type: string
    limit:
      description: Maximum number of results to return per page
      in: query
      name: limit
      schema:
        default: 100
        minimum: 0
        type: integer
  securitySchemes:
    apiToken:
      description: "Preferred authentication method for automation and integrations. Send the API token in the HTTP `Authorization` header.\n\n**Format**:\n  `Authorization: Token {apitoken}`\n\n**Notes**:\n* An API token generated for a specific admin has the same privileges as that admin\n* An API token is automatically removed if it is not used for more than 90 days\n* SSO admins cannot generate admin API tokens. Use organization API tokens when scoped Org/Site privileges are needed."
      in: header
      name: Authorization
      type: apiKey
    csrfToken:
      description: 'Session-based authentication for browser or login/password flows. After a successful [Login](/#operations/login) request, Mist returns a `csrftoken` cookie. Send that value in the `X-CSRFToken` header on later API requests that use the login session.


        **Format**:

        ```

        X-CSRFToken: vwvBuq9qkqaKh7lu8tNc0gkvBfEaLAmx

        ```


        For automation, API Token authentication is preferred.'
      in: header
      name: X-CSRFToken
      type: apiKey
