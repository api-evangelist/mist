tags:
- description: 'Login Endpoints when using Login/Password authentication, with or without 2FA.


    If the Login/Password authentication is successful, Mist will add a `csrftoken` cookie that must be added into the later API Requests (please see [csrfToken (Custom Header Signature)]($h/__auth_CsrfToken))'
  name: Admins Login
paths:
  /api/v1/login:
    post:
      description: 'Authenticate an administrator with email and password. A successful login creates the browser session cookies, including the `csrftoken` value used with the `X-CSRFToken` header on later API requests.


        When 2FA is enabled, either include the `two_factor` code in this request or submit the first factor here and complete the login with [Two Factor](/#operations/twoFactor).'
      operationId: login
      requestBody:
        content:
          application/json:
            examples:
              with-2FA:
                value:
                  email: test@mistsys.com
                  password: foryoureyesonly
                  two_factor: '123456'
              without-2FA:
                value:
                  email: test@mistsys.com
                  password: foryoureyesonly
            schema:
              $ref: '#/components/schemas/login'
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        '400':
          $ref: '#/components/responses/LoginFailure'
      security: []
      summary: login
      tags:
      - Admins Login
  /api/v1/login/two_factor:
    post:
      description: Complete a two-factor login by submitting the 2FA code after the initial email/password step has created a pending login session.
      operationId: twoFactor
      requestBody:
        content:
          application/json:
            examples:
              Example:
                value:
                  two_factor: '123456'
            schema:
              $ref: '#/components/schemas/two_factor_string'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          description: two_factor code is incorrect or the user hasn't login yet
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          description: The user doesn't have 2FA enabled
        '429':
          $ref: '#/components/responses/HTTP429'
      security: []
      summary: twoFactor
      tags:
      - Admins Login
components:
  schemas:
    response_http403:
      additionalProperties: false
      description: Standard HTTP 403 permission error response
      properties:
        detail:
          description: Human-readable explanation of the permission error
          examples:
          - You do not have permission to perform this action.
          type: string
      type: object
    response_http400:
      additionalProperties: false
      description: Standard HTTP 400 bad request error response
      properties:
        detail:
          description: Human-readable explanation of the bad request error
          examples:
          - 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
          type: string
      type: object
    login:
      description: Login request using email/password and an optional two-factor code
      properties:
        email:
          description: Administrator email address used to log in
          examples:
          - test@mistsys.com
          type: string
        password:
          description: Administrator password used to log in
          examples:
          - foryoureyesonly
          type: string
        two_factor:
          description: Optional two-factor authentication code for the login request
          examples:
          - '123456'
          type: string
      required:
      - email
      - password
      type: object
    response_http429:
      additionalProperties: false
      description: Standard HTTP 429 rate limit error response
      properties:
        detail:
          description: Human-readable explanation of the rate limit error
          examples:
          - Too Many Request. The API Token used for the request reached the 5000 API Calls per hour threshold
          type: string
      type: object
    two_factor_string:
      description: Request body for submitting a 2FA login code
      properties:
        two_factor:
          description: One-time 2FA login code generated by the user's authenticator app
          examples:
          - '123456'
          type: string
      required:
      - two_factor
      type: object
    response_login_success:
      additionalProperties: false
      description: Login response body, empty on normal success or populated with two-factor state
      properties:
        email:
          description: Admin email address for a login flow that requires two-factor authentication
          type: string
        two_factor_passed:
          description: Whether the supplied two-factor code has been accepted for this login
          type: boolean
        two_factor_required:
          description: Whether this login requires a two-factor code before a session is established
          type: boolean
      type: object
    response_login_failure:
      additionalProperties: false
      description: Login failure response returned when authentication cannot continue locally
      properties:
        detail:
          description: Human-readable login failure message returned by the API
          type: string
        forward_url:
          description: SSO URL where the user should continue login, when provided
          type: string
      required:
      - detail
      type: object
  responses:
    HTTP400:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP400Example'
          schema:
            $ref: '#/components/schemas/response_http400'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP400Example'
          schema:
            $ref: '#/components/schemas/response_http400'
      description: Bad Syntax
    OK:
      description: OK
    LoginFailure:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/LoginFailureExample'
          schema:
            $ref: '#/components/schemas/response_login_failure'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/LoginFailureExample'
          schema:
            $ref: '#/components/schemas/response_login_failure'
      description: Login Failed
    LoginSuccess:
      content:
        application/json:
          examples:
            2FA-required:
              $ref: '#/components/examples/LoginSuccess2FArequired'
            OK:
              $ref: '#/components/examples/LoginSuccessOK'
          schema:
            $ref: '#/components/schemas/response_login_success'
        application/vnd.api+json:
          examples:
            2FA-required:
              $ref: '#/components/examples/LoginSuccess2FArequired'
            OK:
              $ref: '#/components/examples/LoginSuccessOK'
          schema:
            $ref: '#/components/schemas/response_login_success'
      description: Login Success
      headers:
        Set-Cookie:
          description: Session Cookie if login/password authentication is successful
          schema:
            examples:
            - csrftoken=vwvBuq9qkqaKh7lu8tNc0gkvBfEaLAmx; expires=Tue, 15-Mar-2016 19:47:20 GMT; Max-Age=31449600; Path=/
            type: string
    HTTP403:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP403Example'
          schema:
            $ref: '#/components/schemas/response_http403'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP403Example'
          schema:
            $ref: '#/components/schemas/response_http403'
      description: Permission Denied
    HTTP429:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP429Example'
          schema:
            $ref: '#/components/schemas/response_http429'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP429Example'
          schema:
            $ref: '#/components/schemas/response_http429'
      description: Too Many Request. The API Token used for the request reached the 5000 API Calls per hour threshold
  examples:
    LoginSuccess2FArequired:
      value:
        email: test@mistsys.com
        two_factor_passed: false
        two_factor_required: true
    HTTP400Example:
      value:
        detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
    HTTP429Example:
      value:
        detail: Too Many Request. The API Token used for the request reached the 5000 API Calls per hour threshold
    HTTP403Example:
      value:
        detail: You do not have permission to perform this action.
    LoginFailureExample:
      value:
        detail: sso admin login needs to be initiated by IdP
        forward_url: https://my.sso/idp_sso_url
    LoginSuccessOK:
      value: {}
  securitySchemes:
    apiToken:
      description: "Preferred authentication method for automation and integrations. Send the API token in the HTTP `Authorization` header.\n\n**Format**:\n  `Authorization: Token {apitoken}`\n\n**Notes**:\n* An API token generated for a specific admin has the same privileges as that admin\n* An API token is automatically removed if it is not used for more than 90 days\n* SSO admins cannot generate admin API tokens. Use organization API tokens when scoped Org/Site privileges are needed."
      in: header
      name: Authorization
      type: apiKey
    csrfToken:
      description: 'Session-based authentication for browser or login/password flows. After a successful [Login](/#operations/login) request, Mist returns a `csrftoken` cookie. Send that value in the `X-CSRFToken` header on later API requests that use the login session.


        **Format**:

        ```

        X-CSRFToken: vwvBuq9qkqaKh7lu8tNc0gkvBfEaLAmx

        ```


        For automation, API Token authentication is preferred.'
      in: header
      name: X-CSRFToken
      type: apiKey
